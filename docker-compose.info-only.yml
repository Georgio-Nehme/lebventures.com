# Info-only stack docker-compose — pulls images from the info-only-* ECR
# repositories (built from the `info-only` branch) instead of building
# locally. This replaces the production stack on the same host — it does
# not run alongside `docker-compose.prod.yml`.
#
# Recommended folder layout on your VPS:
#   /opt/lebventures/
#     docker-compose.info-only.yml
#     .env.prod          ← ECR_REGISTRY
#     api.env            ← copy from api/.env.example and fill in
#     frontend.env       ← copy from frontend/.env.example and fill in
#     admin.env          ← copy from admin/.env.example and fill in
#
# Start the stack:
#   docker compose -f docker-compose.info-only.yml --env-file .env.prod up -d

services:

  api:
    image: ${ECR_REGISTRY}/info-only-lebventures-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # NOTE: api.env must now also contain CONTENT_TABLE=lebventures-content
      # (the new DynamoDB table used by the website-content editor). The
      # IAM identity used by this container needs DynamoDB access on that
      # table in addition to the existing tables.
      - ./api.env
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - lebventures

  frontend:
    image: ${ECR_REGISTRY}/info-only-lebventures-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"   # host nginx proxies to :8080 → container nginx on :80
    env_file:
      - ./frontend.env
    depends_on:
      - api
    networks:
      - lebventures

  admin:
    image: ${ECR_REGISTRY}/info-only-lebventures-admin:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./admin.env
    depends_on:
      - api
    networks:
      - lebventures

networks:
  lebventures:
    driver: bridge
